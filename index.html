<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mensaje de Undertale ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        /* Fondo */
        .background-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/bg_endingview_0.png');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Personajes sobre el cuadro */
        .sprites-container {
            position: absolute;
            bottom: 28%; /* Ajustado para el nuevo tamaño del cuadro */
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            z-index: 2;
            width: 100%;
        }

        .sprite-asriel {
            image-rendering: pixelated;
            height: 14vh;
            min-height: 90px;
            filter: drop-shadow(0px 4px 5px rgba(0,0,0,0.8));
        }

        .sprite-papyrus {
            image-rendering: pixelated;
            height: 20vh;
            min-height: 130px;
            filter: drop-shadow(0px 4px 5px rgba(0,0,0,0.8));
        }

        /* CUADRO DE DIÁLOGO REDUCIDO */
        .dialogue-box {
            position: absolute;
            bottom: 3%;
            width: 94%;
            max-width: 600px;
            height: 22%; /* Reducido (antes 30%) */
            min-height: 110px;
            background-color: #000;
            border: 4px solid #fff;
            padding: 10px 15px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        /* Rostro / Corazón más pequeño */
        .face-image {
            image-rendering: pixelated;
            width: 70px;
            height: 70px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .text-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .speaker-name {
            color: #ffff00;
            font-size: 13px;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .dialogue-text-wrapper {
            display: flex;
            align-items: flex-start;
        }

        .asterisk {
            font-size: 12px;
            margin-right: 8px;
            line-height: 1.6;
        }

        .dialogue-text {
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Pantalla negra de Inicio */
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .start-btn {
            background-color: transparent;
            color: #fff;
            border: 2px solid #fff;
            padding: 15px 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }

        .start-btn:hover {
            color: #ffff00;
            border-color: #ffff00;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        /* Ajustes precisos para teléfonos móviles */
        @media (max-width: 600px) {
            .dialogue-box {
                bottom: 2%;
                height: 25%;
                min-height: 100px;
                padding: 8px 10px;
                gap: 10px;
            }
            .face-image {
                width: 60px;
                height: 60px;
            }
            .dialogue-text, .asterisk {
                font-size: 10px;
                line-height: 1.5;
            }
            .speaker-name {
                font-size: 11px;
                margin-bottom: 5px;
            }
            .sprites-container {
                bottom: 29%;
            }
        }
    </style>
</head>
<body>

    <div class="game-screen">
        <div class="background-scene"></div>

        <div class="sprites-container">
            <img src="assets/spr_papyrus_d_0.png" alt="Papyrus" class="sprite-papyrus">
            <img src="assets/spr_asriel_d_0.png" alt="Asriel" class="sprite-asriel">
        </div>

        <div class="dialogue-box" id="dialogue-box">
            <img id="face-img" class="face-image" src="" alt="Face">
            <div class="text-container">
                <div class="speaker-name" id="speaker"></div>
                <div class="dialogue-text-wrapper">
                    <span class="asterisk" id="asterisk">*</span>
                    <span class="dialogue-text" id="text-content"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="start-screen" id="start-screen">
        <p style="color: #fff; font-size: 10px; margin-bottom: 20px; text-align: center;">Toca para abrir el mensaje...</p>
        <button class="start-btn" id="start-btn">❤️ COMENZAR</button>
    </div>

    <audio id="bg-music" loop>
        <source src="assets/musicbox.ogg" type="audio/ogg">
    </audio>

    <script>
        const story = [
            { face: "assets/spr_face_papyrus_0.png", speaker: "PAPYRUS", text: "¡NYEH HEH HEH! ¡HOLA, HUMANA!" },
            { face: "assets/spr_face_papyrus_0.png", speaker: "PAPYRUS", text: "¡EL GRAN PAPYRUS TIENE UNA ENTREGA MUY ESPECIAL PARA TI!" },
            { face: "assets/spr_face_asriel0_0.png", speaker: "ASRIEL", text: "¡Howdy! Nos pidieron que te trajéramos esta carta..." },
            { face: "assets/spr_face_asriel0_0.png", speaker: "ASRIEL", text: "¡Aquí dice que es de parte de tu persona favorita!" },
            { face: "assets/spr_face_papyrus_0.png", speaker: "PAPYRUS", text: "¡ASÍ ES! ¡FUE ESCRITA CON MUCHA DETERMINACIÓN!\n¡AQUÍ TIENES!" },
            
            // La línea que causaba el error fue reparada (faltaba un ":")
            { face: "assets/spr_heart_0.png", speaker: "CARTA", text: "¡Hola, mi murcielaguito!\nEspero que estés bien." },
            { face: "assets/spr_heart_0.png", speaker: "CARTA", text: "Sé que estos días has estado muy cansada y ha sido muy difícil para ti..." },
            { face: "assets/spr_heart_0.png", speaker: "CARTA", text: "...pero olvida eso un momento, porque hoy es el día de la novia: ¡es tu día!" },
            { face: "assets/spr_heart_0.png", speaker: "CARTA", text: "Te quiero agradecer por llegar a mi vida." },
            { face: "assets/spr_heart_0.png", speaker: "CARTA", text: "La verdad, nunca imaginé que nuestro primer encuentro en Discord sería tan espontáneo..." },
            { face: "assets/spr_heart_0.png", speaker: "CARTA", text: "...ni que me iría enamorando de ti y de tus locuras en tan poco tiempo." },
            { face: "assets/spr_heart_0.png", speaker: "CARTA", text: "Sé que no siempre tenemos buenos días como pareja y que sí es muy difícil..." },
            { face: "assets/spr_heart_0.png", speaker: "CARTA", text: "...pero no cambiaría nada en mi vida, porque te conocí y te tengo a mi lado en este momento." },
            { face: "assets/spr_heart_0.png", speaker: "CARTA", text: "Gracias por ser la novia más genial y linda del mundo, y gracias por llegar a mi vida." },
            { face: "assets/spr_heart_0.png", speaker: "CARTA", text: "Te amo, Kitty. ❤️" }
        ];

        let currentLine = 0;
        let charIndex = 0;
        let isTyping = false;
        let typeInterval;
        
        const textElement = document.getElementById("text-content");
        const speakerElement = document.getElementById("speaker");
        const faceImg = document.getElementById("face-img");
        const asterisk = document.getElementById("asterisk");
        const dialogueBox = document.getElementById("dialogue-box");
        const music = document.getElementById("bg-music");

        function prepareLine() {
            const lineData = story[currentLine];
            speakerElement.innerText = lineData.speaker;
            faceImg.src = lineData.face;
            
            if (lineData.speaker === "CARTA") {
                asterisk.style.visibility = "hidden";
            } else {
                asterisk.style.visibility = "visible";
            }
        }

        function typeWriter() {
            if (charIndex < story[currentLine].text.length) {
                textElement.innerHTML += story[currentLine].text.charAt(charIndex);
                charIndex++;
                isTyping = true;
                typeInterval = setTimeout(typeWriter, 35);
            } else {
                isTyping = false;
            }
        }

        function showNextLine() {
            if (isTyping) {
                clearTimeout(typeInterval);
                textElement.innerHTML = story[currentLine].text;
                isTyping = false;
            } else {
                currentLine++;
                if (currentLine < story.length) {
                    charIndex = 0;
                    textElement.innerHTML = "";
                    prepareLine();
                    typeWriter();
                } else {
                    currentLine = 5; 
                    charIndex = 0;
                    textElement.innerHTML = "";
                    prepareLine();
                    typeWriter();
                }
            }
        }

        document.getElementById("start-btn").addEventListener("click", () => {
            document.getElementById("start-screen").style.display = "none";
            music.volume = 0.7;
            music.play().catch(error => console.log("Audio bloqueado:", error));

            prepareLine();
            typeWriter();
        });

        dialogueBox.addEventListener("click", showNextLine);
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "Enter") {
                showNextLine();
            }
        });
    </script>
</body>
</html>
